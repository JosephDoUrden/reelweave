name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Lint (ruff)
        run: |
          uvx ruff@0.17.5 check .
          uvx ruff@0.17.5 format --check .
      - name: Import check
        run: |
          uv venv
          uv pip install pyyaml requests
          uv run python -c "import ast,glob; [ast.parse(open(f).read()) for f in glob.glob('reelweave/*.py')]"
