[project]
name = "reelweave"
version = "0.1.0"
description = "Turn raw travel vlogs into TikTok/Reels — fully local, on Apple Silicon. No cloud, no API keys."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusufhan Saçak" }]
keywords = [
  "video-editing", "ffmpeg", "whisper", "mlx", "apple-silicon",
  "ollama", "qwen", "tiktok", "reels", "shorts", "local-ai",
  "local-llm", "vision-llm", "vertical-video", "subtitles",
  "karaoke-captions", "offline-ai", "opus-clip-alternative",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion",
  "Operating System :: MacOS",
]
dependencies = [
  "mlx-whisper>=0.4",
  "mlx-vlm>=0.3",
  "scenedetect[opencv]>=0.6.4",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/JosephDoUrden/reelweave"
Repository = "https://github.com/JosephDoUrden/reelweave"
Issues = "https://github.com/JosephDoUrden/reelweave/issues"

[project.scripts]
reelweave = "reelweave.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelweave"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded ASS subtitle headers and HTML/CSS templates: one-line records by format.
"reelweave/caption_ass.py" = ["E501"]
"reelweave/package.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
